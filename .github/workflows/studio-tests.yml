name: studio-tests

on:
  push:
    paths: ["studio/**", ".github/workflows/studio-tests.yml"]
  pull_request:
    paths: ["studio/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps (ffmpeg + color emoji font)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji
      - name: Python deps
        run: pip install -r studio/requirements.txt pytest
      - name: Tests (offline — no API keys, mock voice, export publishing)
        working-directory: studio
        run: python -m pytest tests/ -q
